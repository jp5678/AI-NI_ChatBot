<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연구 동향 대시보드 | AI-NI_ChatBot</title>
<meta name="description" content="AI융합 간호정보학 연구 동향 대시보드 — PubMed·ClinicalTrials.gov 공개 API 기반 자동 집계">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#065F46; --secondary:#10B981; --accent:#34D399; --gold:#F4C560;
  --font-title:'Noto Serif KR',serif; --font-body:'Noto Sans KR',sans-serif; --font-code:'JetBrains Mono',monospace;
  --radius:16px; --transition:180ms cubic-bezier(.4,0,.2,1);
  /* 흰 글씨를 얹는 그라디언트 전용 색.
     --secondary(#10B981) 위의 흰 글씨는 2.54:1 로 WCAG AA 에 미달하므로,
     버튼·로고 배경에는 아래의 더 어두운 값을 사용합니다. (밝은 쪽 5.32:1) */
  --grad-from:#0A7A5A; --grad-to:#064A37;
}
html[data-theme="dark"]{
  --bg:#0A0F0D; --surface:rgba(255,255,255,.045); --surface-2:rgba(255,255,255,.075);
  --border:rgba(52,211,153,.18); --border-strong:rgba(52,211,153,.34);
  --text:#E8F2EE; --text-muted:#9DB3AB; --text-dim:#8DA39B;
  --grid:rgba(255,255,255,.09); --code-bg:#0B1411;
  --shadow:0 8px 32px rgba(0,0,0,.45);
  --up:#34D399; --down:#FCA5A5;
  --warn:#F4C560; --warn-bg:rgba(244,197,96,.12); --warn-bd:rgba(244,197,96,.42);
  --danger:#FCA5A5; --danger-bg:rgba(220,38,38,.13); --danger-bd:rgba(248,113,113,.4);
}
html[data-theme="light"]{
  --bg:#F3F7F5; --surface:rgba(6,95,70,.045); --surface-2:rgba(6,95,70,.085);
  --border:rgba(6,95,70,.18); --border-strong:rgba(6,95,70,.34);
  --text:#10231C; --text-muted:#446056; --text-dim:#4A625A;
  --grid:rgba(6,95,70,.13); --code-bg:#ECF3F0;
  --shadow:0 6px 24px rgba(6,95,70,.10);
  --up:#065F46; --down:#B91C1C;
  /* 금색 계열은 밝은 배경 대비가 낮아 텍스트용으로는 더 어둡게 씁니다 (AI 배지 5.31:1) */
  --warn:#6E530E; --warn-bg:rgba(244,197,96,.2); --warn-bd:rgba(185,140,20,.45);
  --danger:#B91C1C; --danger-bg:rgba(220,38,38,.08); --danger-bd:rgba(185,28,28,.35);
}
*,*::before,*::after{box-sizing:border-box;}
[hidden]{display:none!important;}
body{
  margin:0;padding:24px 18px 56px;font-family:var(--font-body);font-size:15px;line-height:1.7;
  color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;
}
html[data-theme="dark"] body{background:radial-gradient(1100px 600px at 12% -12%,rgba(6,95,70,.16),transparent 60%),var(--bg);}
html[data-theme="light"] body{background:radial-gradient(1000px 540px at 10% -14%,rgba(52,211,153,.09),transparent 60%),var(--bg);}
.wrap{max-width:1120px;margin:0 auto;}
h1,h2,h3{font-family:var(--font-title);margin:0;letter-spacing:-.01em;}
a{color:var(--accent);} html[data-theme="light"] a{color:var(--primary);}
/* 링크 규칙이 버튼 글자색을 덮어쓰지 않도록 특이도를 올립니다 (라이트 모드 1.34:1 방지) */
html[data-theme="light"] a.btn{color:var(--text);}
html[data-theme="light"] a.btn-primary,a.btn-primary{color:#fff;}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px;
}
header.card{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
.brand{display:flex;gap:12px;align-items:center;}
.logo{
  width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--grad-from),var(--grad-to));box-shadow:0 6px 18px rgba(6,95,70,.4);
}
.logo svg{width:23px;height:23px;}
header h1{font-size:1.3rem;}
header .sub{margin:2px 0 0;font-size:.8rem;color:var(--text-muted);}
.spacer{flex:1;}
.hdr-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;
  font-size:.83rem;font-weight:500;border:1px solid var(--border);background:var(--surface-2);
  color:var(--text);transition:all var(--transition);white-space:nowrap;
}
.btn:hover{color:var(--text);border-color:var(--border-strong);}
.btn svg{width:15px;height:15px;}
.btn-primary{background:linear-gradient(135deg,var(--grad-from),var(--grad-to));color:#fff;border-color:transparent;}
.btn-primary:hover{filter:brightness(1.1);color:#fff;}

.stamp{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:11px 15px;border-radius:11px;margin-bottom:16px;
  background:var(--surface-2);border:1px solid var(--border);
  font-size:.8rem;color:var(--text-muted);
}
.stamp b{color:var(--text);font-family:var(--font-code);font-size:.8rem;font-weight:500;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--secondary);flex:none;}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(186px,1fr));gap:12px;margin-bottom:16px;}
.kpi{
  padding:15px 17px;border-radius:13px;background:var(--surface);
  border:1px solid var(--border);box-shadow:var(--shadow);
}
.kpi .k{font-size:.73rem;color:var(--text-muted);letter-spacing:.04em;}
.kpi .v{font-family:var(--font-code);font-size:1.6rem;font-weight:500;margin-top:4px;line-height:1.2;}
.kpi .n{font-size:.75rem;color:var(--text-muted);margin-top:3px;}
.kpi .v.sm{font-size:1.05rem;font-family:var(--font-body);font-weight:700;line-height:1.35;}
.up{color:var(--up);} .down{color:var(--down);}

/* 패널 */
.panel-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px;}
.panel-head h2{font-size:1.05rem;}
.tag{
  font-size:.7rem;padding:2px 9px;border-radius:99px;font-weight:500;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);white-space:nowrap;
}
.panel-desc{margin:0 0 14px;font-size:.82rem;color:var(--text-muted);}
.chart-box{width:100%;overflow-x:auto;}
svg.chart{display:block;width:100%;height:auto;min-width:520px;}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:.76rem;color:var(--text-muted);}
.chart-legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px;}
.chart-legend .dash{background:none;border-top:2px dashed var(--gold);height:0;}

details.data{margin-top:12px;}
details.data > summary{
  cursor:pointer;font-size:.77rem;color:var(--text-muted);padding:5px 0;list-style:none;
  display:inline-flex;align-items:center;gap:6px;
}
details.data > summary::-webkit-details-marker{display:none;}
details.data > summary::before{content:"▸";transition:transform var(--transition);}
details.data[open] > summary::before{transform:rotate(90deg);}
details.data > summary:hover{color:var(--text);}
table{border-collapse:collapse;width:100%;font-size:.79rem;margin-top:8px;}
th,td{padding:7px 11px;text-align:left;border-bottom:1px solid var(--border);}
th{background:var(--surface-2);font-weight:700;color:var(--accent);white-space:nowrap;}
html[data-theme="light"] th{color:var(--primary);}
td.num,th.num{text-align:right;font-family:var(--font-code);font-size:.76rem;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;}

code{font-family:var(--font-code);font-size:.79rem;background:var(--surface-2);
  border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:var(--text);}
html[data-theme="light"] code{color:var(--primary);}
pre.q{
  margin:6px 0 0;padding:11px 13px;background:var(--code-bg);border:1px solid var(--border);
  border-radius:9px;overflow-x:auto;font-family:var(--font-code);font-size:.75rem;
  line-height:1.6;color:var(--text-muted);white-space:pre-wrap;word-break:break-word;
}

.note{
  padding:13px 15px;border-radius:11px;font-size:.81rem;line-height:1.72;
  background:var(--warn-bg);border:1px solid var(--warn-bd);border-left:3px solid var(--warn);
  color:var(--text);
}
.note b{color:var(--warn);}
.note ul{margin:7px 0 0;padding-left:19px;}
.note li{margin:3px 0;}

.err{
  padding:16px 18px;border-radius:11px;
  background:var(--danger-bg);border:1px solid var(--danger-bd);color:var(--danger);font-size:.86rem;
}
.err pre{margin:9px 0 0;font-family:var(--font-code);font-size:.76rem;white-space:pre-wrap;}

.src-list{margin:0;padding-left:19px;font-size:.82rem;color:var(--text-muted);}
.src-list li{margin:4px 0;}

/* AI 해설 */
.insight-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
.insight-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto;}
.badge-ai{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 11px;border-radius:99px;font-size:.72rem;font-weight:500;
  background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn);
}
.badge-ai svg{width:13px;height:13px;}
.insight-meta{font-size:.74rem;color:var(--text-muted);margin-top:10px;}
.insight-body{
  margin-top:14px;padding:16px 18px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--border);
  font-size:.87rem;line-height:1.78;
}
.insight-body > *:first-child{margin-top:0;}
.insight-body > *:last-child{margin-bottom:0;}
.insight-body h1,.insight-body h2,.insight-body h3,.insight-body h4{
  font-family:var(--font-title);margin:1.2em 0 .5em;line-height:1.4;}
.insight-body h1{font-size:1.1rem;} .insight-body h2{font-size:1.02rem;color:var(--accent);}
html[data-theme="light"] .insight-body h2{color:var(--primary);}
.insight-body h3{font-size:.95rem;} .insight-body h4{font-size:.89rem;color:var(--text-muted);}
.insight-body p{margin:.6em 0;}
.insight-body ul,.insight-body ol{margin:.5em 0;padding-left:1.35em;}
.insight-body li{margin:.22em 0;}
.insight-body li::marker{color:var(--secondary);}
html[data-theme="light"] .insight-body li::marker{color:var(--primary);}
.insight-body strong{font-weight:700;color:var(--text);}
.insight-body blockquote{margin:.8em 0;padding:.35em 0 .35em 13px;border-left:3px solid var(--secondary);color:var(--text-muted);}
.insight-body code.inline-code{font-family:var(--font-code);font-size:.85em;padding:1px 6px;border-radius:5px;
  background:var(--surface);border:1px solid var(--border);color:var(--text);}
html[data-theme="light"] .insight-body code.inline-code{color:var(--primary);}
.insight-body pre{margin:.8em 0;padding:12px 14px;background:var(--code-bg);border:1px solid var(--border);
  border-radius:9px;overflow-x:auto;}
.insight-body pre code{font-family:var(--font-code);font-size:.8rem;line-height:1.65;}
.insight-body .table-wrap{overflow-x:auto;margin:.8em 0;border:1px solid var(--border);border-radius:9px;}
.insight-body table{margin:0;}
.insight-body hr{border:none;border-top:1px solid var(--border);margin:1.1em 0;}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--accent);vertical-align:-2px;
  margin-left:2px;animation:blink 1s steps(2,start) infinite;}
@keyframes blink{50%{opacity:0;}}

.loading{display:flex;gap:10px;align-items:center;color:var(--text-muted);font-size:.88rem;padding:26px 0;justify-content:center;}
.loading svg{width:17px;height:17px;animation:spin 1.1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

footer{text-align:center;font-size:.75rem;color:var(--text-dim);margin-top:26px;line-height:1.7;}

@media (max-width:640px){
  body{padding:16px 12px 44px;font-size:14.5px;}
  .card{padding:16px 15px;}
  header h1{font-size:1.12rem;}
  .kpi .v{font-size:1.4rem;}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important;}}
</style>
</head>
<body>
<div class="wrap">

<header class="card">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2.5 4 6v5.6c0 4.9 3.4 9.1 8 10.4 4.6-1.3 8-5.5 8-10.4V6l-8-3.5Z"/><path d="M12 8.2v6.2M8.9 11.3h6.2"/>
      </svg>
    </div>
    <div>
      <h1>연구 동향 대시보드</h1>
      <p class="sub">AI-NI_ChatBot · AI융합 간호정보학</p>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="hdr-actions">
    <button id="theme" class="btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/></svg>
      <span id="theme-label">라이트 모드</span>
    </button>
    <a class="btn btn-primary" href="./index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4L3 21l1.1-9A8.4 8.4 0 1 1 21 11.5Z"/></svg>
      챗봇으로
    </a>
  </div>
</header>

<div id="root">
  <div class="loading"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/></svg> 데이터를 불러오는 중입니다…</div>
</div>

<footer>
  청암대학교 간호학과 · 정종필 교수 · imjp5678@scjc.ac.kr
</footer>

</div>

<!-- 챗봇의 시스템 프롬프트·마크다운 렌더러를 그대로 재사용하기 위한 숨김 프레임 -->
<iframe id="host" src="ni-bot.html" style="display:none" title="shared prompt source" aria-hidden="true"></iframe>

<script>
"use strict";

const DATA_URL = './data/nursing-informatics.json';
const INSIGHT_CACHE_KEY = 'nibot_dashboard_insight';
/* 챗봇 본체와 같은 한도를 씁니다. 4,000 으로는 4개 절 구성 해설이 중간에 잘립니다. */
const INSIGHT_MAX_TOKENS = 16000;
const INSIGHT_MAX_TOKENS_FALLBACK = 4096;
const INSIGHT_CONTINUE_PROMPT =
  '직전 해설이 길이 제한으로 문장 중간에서 중단되었습니다. 중단된 지점부터 이어서 계속 작성해 주십시오. ' +
  '이미 작성한 내용을 다시 반복하지 말고, 끊긴 문장부터 자연스럽게 이어 주십시오. ' +
  '앞서와 동일하게 제시된 수치 외의 통계·논문명·DOI·URL을 새로 만들어 인용하지 마십시오.';

/* ── 유틸 ─────────────────────────────────────────────── */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => (typeof n === 'number' && isFinite(n)) ? n.toLocaleString('ko-KR') : '—';
const signed = n => (typeof n === 'number' && isFinite(n)) ? (n > 0 ? '+' : '') + n.toLocaleString('ko-KR') + '%' : '—';

function formatStamp(iso){
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* ── SVG 차트 (외부 라이브러리 없이 직접 그림) ──────────── */
function lineChart(series, opts){
  const o = Object.assign({ w:720, h:300, pad:{t:18,r:18,b:34,l:52}, color:'var(--secondary)', area:true }, opts||{});
  if(!series || series.length === 0) return '<p class="panel-desc">표시할 데이터가 없습니다.</p>';

  const W = o.w, H = o.h, P = o.pad;
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const max = Math.max(...series.map(p => p.count), 1);
  const yMax = Math.ceil(max * 1.12 / 10) * 10 || 10;

  const x = i => P.l + (series.length === 1 ? iw/2 : (iw * i) / (series.length - 1));
  const y = v => P.t + ih - (ih * v) / yMax;

  // 눈금
  const ticks = 4;
  let grid = '';
  for(let i = 0; i <= ticks; i++){
    const v = Math.round((yMax / ticks) * i);
    const yy = y(v);
    grid += `<line x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>`;
    grid += `<text x="${P.l-9}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--text-muted)" font-family="JetBrains Mono, monospace">${v}</text>`;
  }

  // x축 라벨 (밀리면 건너뜀)
  const step = series.length > 9 ? 2 : 1;
  let xlabels = '';
  series.forEach((p, i) => {
    if(i % step !== 0 && i !== series.length - 1) return;
    xlabels += `<text x="${x(i)}" y="${H-P.b+19}" text-anchor="middle" font-size="11" fill="var(--text-muted)" font-family="JetBrains Mono, monospace">${p.year}</text>`;
  });

  // 완결 구간 / 진행 중 구간 분리
  const lastComplete = series.reduce((idx, p, i) => p.partial ? idx : i, 0);
  const solid = series.slice(0, lastComplete + 1);
  const dashed = series.slice(lastComplete);

  const pts = arr => arr.map((p) => {
    const i = series.indexOf(p);
    return `${x(i).toFixed(1)},${y(p.count).toFixed(1)}`;
  }).join(' ');

  let area = '';
  if(o.area && solid.length > 1){
    const first = x(0), last = x(lastComplete);
    area = `<polygon points="${first},${y(0)} ${pts(solid)} ${last},${y(0)}" fill="${o.color}" opacity=".13"/>`;
  }

  const solidLine = solid.length > 1
    ? `<polyline points="${pts(solid)}" fill="none" stroke="${o.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : '';
  const dashedLine = dashed.length > 1
    ? `<polyline points="${pts(dashed)}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-dasharray="5 4" stroke-linejoin="round"/>` : '';

  const dots = series.map((p, i) => p.partial
    ? `<circle cx="${x(i)}" cy="${y(p.count)}" r="4.5" fill="var(--bg)" stroke="var(--gold)" stroke-width="2.5"><title>${p.year}년 ${p.count}건 (진행 중)</title></circle>`
    : `<circle cx="${x(i)}" cy="${y(p.count)}" r="3.6" fill="${o.color}"><title>${p.year}년 ${p.count}건</title></circle>`
  ).join('');

  const summary = series.map(p => `${p.year}년 ${p.count}건${p.partial ? '(진행 중)' : ''}`).join(', ');

  return `<div class="chart-box"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || '추이 그래프')}: ${esc(summary)}">
    ${grid}
    <line x1="${P.l}" y1="${P.t}" x2="${P.l}" y2="${H-P.b}" stroke="var(--border-strong)" stroke-width="1"/>
    <line x1="${P.l}" y1="${H-P.b}" x2="${W-P.r}" y2="${H-P.b}" stroke="var(--border-strong)" stroke-width="1"/>
    ${area}${solidLine}${dashedLine}${dots}${xlabels}
  </svg></div>`;
}

function barChart(rows, opts){
  const o = Object.assign({ w:720, rowH:38, pad:{t:8,r:74,b:8,l:184}, color:'var(--secondary)' }, opts||{});
  if(!rows || rows.length === 0) return '<p class="panel-desc">표시할 데이터가 없습니다.</p>';

  const W = o.w, P = o.pad;
  const H = P.t + P.b + rows.length * o.rowH;
  const iw = W - P.l - P.r;
  const max = Math.max(...rows.map(r => r.value), 1);

  const bars = rows.map((r, i) => {
    const yy = P.t + i * o.rowH + 7;
    const bh = o.rowH - 16;
    const bw = Math.max((iw * r.value) / max, 2);
    const label = r.label.length > 20 ? r.label.slice(0, 19) + '…' : r.label;
    return `
      <text x="${P.l-11}" y="${yy + bh/2 + 4}" text-anchor="end" font-size="12.5" fill="var(--text-muted)">${esc(label)}<title>${esc(r.label)}</title></text>
      <rect x="${P.l}" y="${yy}" width="${iw}" height="${bh}" rx="5" fill="var(--surface-2)"/>
      <rect x="${P.l}" y="${yy}" width="${bw.toFixed(1)}" height="${bh}" rx="5" fill="${r.color || o.color}" opacity=".85"><title>${esc(r.label)}: ${num(r.value)}</title></rect>
      <text x="${P.l + bw + 9}" y="${yy + bh/2 + 4}" font-size="12" fill="var(--text)" font-family="JetBrains Mono, monospace">${num(r.value)}</text>`;
  }).join('');

  const summary = rows.map(r => `${r.label} ${r.value}`).join(', ');
  return `<div class="chart-box"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || '막대 그래프')}: ${esc(summary)}">${bars}</svg></div>`;
}

/* ── 표 렌더 ──────────────────────────────────────────── */
function dataTable(headers, rows, summaryLabel){
  return `<details class="data"><summary>${esc(summaryLabel)}</summary><div class="table-wrap"><table>
    <thead><tr>${headers.map(h => `<th${h.num ? ' class="num"' : ''}>${esc(h.label)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td${headers[i].num ? ' class="num"' : ''}>${c}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div></details>`;
}

let NB = null;          // ni-bot.html 이 노출한 공유 훅

function loadSharedHook(){
  return new Promise((resolve) => {
    const frame = document.getElementById('host');
    const grab = () => {
      try{
        resolve((frame.contentWindow && (frame.contentWindow.__NIBOT_SHARED__ || frame.contentWindow.__NIBOT_TEST__)) || null);
      }catch(e){ resolve(null); }
    };
    if(frame.contentDocument && frame.contentDocument.readyState === 'complete') grab();
    else frame.addEventListener('load', grab, { once:true });
    setTimeout(() => resolve(null), 8000);
  });
}

function readStore(key){
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}

/** 교수자 모드는 이 탭에서 잠금이 해제된 경우에만 적용합니다. */
function effectiveMode(){
  const stored = readStore(NB?.STORAGE?.MODE || 'nibot_mode');
  if(stored !== 'instructor') return 'student';
  try{
    return sessionStorage.getItem(NB?.STORAGE?.INSTRUCTOR_UNLOCK || 'nibot_instructor_unlocked') === 'true'
      ? 'instructor' : 'student';
  }catch(e){ return 'student'; }
}

  L.push('4. 간호정보학 교육·연구에 주는 시사점');
  L.push('');
  L.push('제약: 위에 제시되지 않은 통계 수치·논문명·DOI·URL을 새로 만들어 인용하지 마십시오.');
  L.push('출처는 위에 명시된 두 개 API 외에 추가하지 마십시오. 수치를 재계산할 때는 위 값만 사용하십시오.');
  return L.join('\n');
}

function insightCacheGet(generatedAt, mode){
  try{
    const raw = localStorage.getItem(INSIGHT_CACHE_KEY);
    if(!raw) return null;
    const c = JSON.parse(raw);
    return (c && c.generatedAt === generatedAt && c.mode === mode && c.text) ? c : null;
  }catch(e){ return null; }
}

function insightCacheSet(entry){
  try{ localStorage.setItem(INSIGHT_CACHE_KEY, JSON.stringify(entry)); }
  catch(e){ console.warn('[dashboard] 해설 캐시 저장 실패:', e); }
}

function setInsightStatus(html){
  document.getElementById('insight-status').innerHTML = html || '';
}

function showInsight(text, meta){
  const body = document.getElementById('insight-body');
  const metaEl = document.getElementById('insight-meta');
  body.hidden = false;
  body.innerHTML = NB && NB.renderMarkdown ? NB.renderMarkdown(text) : esc(text).replace(/\n/g, '<br>');
  if(meta){ metaEl.hidden = false; metaEl.textContent = meta; }
}

/* 직전 해설의 문맥. 이어쓰기에 사용합니다. */
let INSIGHT_CTX = { digest:null, text:'', usage:{ input:0, output:0 } };

async function runInsight(isContinue){
  const button = document.getElementById('insight-run');
  const label = document.getElementById('insight-run-label');

  if(!NB){
    setInsightStatus('<div class="note" style="margin-top:12px">챗봇 모듈을 불러오지 못했습니다. 페이지를 새로고침한 뒤 다시 시도해 주십시오.</div>');
    return;
  }

  const apiKey = (readStore(NB.STORAGE.KEY) || '').trim();
  if(!NB.validate.apiKey(apiKey).ok){
    setInsightStatus(
      '<div class="note" style="margin-top:12px"><b>API 키가 필요합니다.</b> ' +
      '<a href="./index.html">챗봇 화면</a>에서 Anthropic API 키를 입력하신 뒤 이 페이지로 돌아오십시오. ' +
      '키는 이 브라우저에만 저장되며 대시보드가 별도로 보관하지 않습니다.</div>');
    return;
  }

  const model = (readStore(NB.STORAGE.MODEL) || NB.DEFAULT_MODEL).trim();
  const mode = effectiveMode();

  button.disabled = true;
  label.textContent = isContinue ? '이어서 생성 중…' : '생성 중…';
  setInsightStatus('<div class="loading"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/></svg> ' +
    (isContinue ? '끊긴 지점부터 이어서 작성하고 있습니다…' : '대시보드 수치를 해석하고 있습니다…') + '</div>');

  const body = document.getElementById('insight-body');
  const metaEl = document.getElementById('insight-meta');
  body.hidden = false;
  metaEl.hidden = true;

  // 이어쓰기면 기존 본문을 유지한 채 뒤에 덧붙입니다.
  const digest = (isContinue && INSIGHT_CTX.digest) ? INSIGHT_CTX.digest : buildDigest(CURRENT);
  const prior = isContinue ? INSIGHT_CTX.text : '';
  if(!isContinue){ body.innerHTML = ''; INSIGHT_CTX = { digest, text:'', usage:{ input:0, output:0 } }; }

  let text = prior;
  let usage = { input: INSIGHT_CTX.usage.input, output: INSIGHT_CTX.usage.output };
  let stopReason = null;
  let failure = null;
  let frameQueued = false;

  const paint = () => {
    if(frameQueued) return;
    frameQueued = true;
    requestAnimationFrame(() => {
      frameQueued = false;
      body.innerHTML = (NB.renderMarkdown ? NB.renderMarkdown(text) : esc(text)) + '<span class="caret"></span>';
    });
  };

  try{
    const messages = isContinue && prior
      ? [{ role:'user', content: digest },
         { role:'assistant', content: prior },
         { role:'user', content: INSIGHT_CONTINUE_PROMPT }]
      : [{ role:'user', content: digest }];

    const post = (maxTokens) => fetch(NB.API_ENDPOINT, {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': NB.API_VERSION,
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model,
        max_tokens: maxTokens,
        stream: true,
        system: NB.buildSystemPrompt(mode),
        messages
        // 검증된 원자료를 해석하는 작업이므로 웹 검색 도구는 붙이지 않습니다.
      })
    });

    let response = await post(INSIGHT_MAX_TOKENS);

    // 모델이 큰 max_tokens 를 허용하지 않으면 1회만 낮춰 재시도합니다.
    if(response.status === 400){
      const detail = await response.clone().text().catch(() => '');
      if(/max_tokens/i.test(detail)){
        console.warn('[dashboard] max_tokens ' + INSIGHT_MAX_TOKENS + ' 거부 → ' + INSIGHT_MAX_TOKENS_FALLBACK + ' 재시도');
        response = await post(INSIGHT_MAX_TOKENS_FALLBACK);
      }
    }

    if(!response.ok){
      const map = { 401:'API 키가 유효하지 않습니다. 키를 다시 확인해 주십시오.',
                    403:'API 키가 유효하지 않습니다. 키를 다시 확인해 주십시오.',
                    429:'요청 한도를 초과했습니다. 잠시 후 다시 시도해 주십시오.',
                    500:'서버가 일시적으로 과부하 상태입니다.',
                    529:'서버가 일시적으로 과부하 상태입니다.' };
      let detail = '';
      try{ detail = (await response.text()).slice(0, 300); }catch(e){}
      failure = map[response.status] || ('API 요청이 실패했습니다. (HTTP ' + response.status + ')' + (detail ? '\n' + detail : ''));
    }else if(!response.body){
      failure = '응답 스트림을 읽을 수 없습니다. 브라우저를 최신 버전으로 업데이트해 주십시오.';
    }else{
      const reader = response.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buffer = '';
      const blockTypes = new Map();

      while(true){
        const { done, value } = await reader.read();
        if(done) break;
        buffer += decoder.decode(value, { stream:true });
        const chunks = buffer.split('\n\n');
        buffer = chunks.pop() || '';

        for(const chunk of chunks){
          const payload = chunk.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).trim()).join('');
          if(!payload || payload === '[DONE]') continue;
          let evt;
          try{ evt = JSON.parse(payload); }catch(e){ continue; }

          if(evt.type === 'message_start' && evt.message?.usage){
            usage.input += evt.message.usage.input_tokens || 0;
            usage.output += evt.message.usage.output_tokens || 0;
          }else if(evt.type === 'content_block_start'){
            blockTypes.set(evt.index, evt.content_block?.type);
            if(evt.content_block?.type === 'text' && evt.content_block.text){ text += evt.content_block.text; paint(); }
          }else if(evt.type === 'content_block_delta'){
            if(evt.delta?.type === 'text_delta' && blockTypes.get(evt.index) === 'text'){
              text += evt.delta.text || ''; paint();
            }
          }else if(evt.type === 'message_delta'){
            if(evt.usage) usage.output += evt.usage.output_tokens || 0;
            if(evt.delta?.stop_reason) stopReason = evt.delta.stop_reason;
          }else if(evt.type === 'error'){
            failure = evt.error?.type === 'overloaded_error'
              ? '서버가 일시적으로 과부하 상태입니다.'
              : (evt.error?.message || '스트리밍 중 오류가 발생했습니다.');
          }
        }
      }
    }
  }catch(error){
    console.error('[dashboard] 해설 생성 실패:', error);
    failure = '네트워크 오류로 요청에 실패했습니다. 인터넷 연결과 광고 차단 확장 프로그램을 확인해 주십시오.';
  }

  button.disabled = false;
  label.textContent = '다시 생성';

  const finalText = text.trim();
  const truncated = stopReason === 'max_tokens';

  if(finalText){
    const stamp = formatStamp(new Date().toISOString());
    const meta = `${stamp} 생성 · 모델 ${model} · ${mode === 'instructor' ? '교수자' : '학습자'} 모드 · ` +
                 `토큰 입력 ${num(usage.input)} / 출력 ${num(usage.output)}` +
                 (truncated ? ' · 길이 제한으로 중단됨' : '');

    INSIGHT_CTX.digest = digest;
    INSIGHT_CTX.text = finalText;
    INSIGHT_CTX.usage = usage;

    showInsight(finalText, meta);
    insightCacheSet({ generatedAt: CURRENT.generatedAt, mode, model, text: finalText, meta,
                      digest, truncated, ts: Date.now() });

    setInsightStatus('');
    if(truncated) renderContinueNotice();
  }else{
    body.hidden = true;
  }

  if(failure){
    const errHtml = `<div class="err" style="margin-top:12px"><strong>해설을 생성하지 못했습니다.</strong><pre>${esc(failure)}</pre></div>`;
    // 이어쓰기 시도가 실패한 경우, 오류만 남기면 재시도할 수 없으므로 버튼을 함께 유지합니다.
    if(isContinue && INSIGHT_CTX.text) renderContinueNotice(errHtml);
    else setInsightStatus(errHtml);
  }
}

/** 길이 제한으로 잘렸을 때 이어쓰기 안내와 버튼을 표시합니다. */
function renderContinueNotice(prefixHtml){
  setInsightStatus(
    (prefixHtml || '') +
    '<div class="note" style="margin-top:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">' +
    '<span style="flex:1;min-width:190px"><b>해설이 길이 제한으로 중단되었습니다.</b> ' +
    '아래 버튼을 누르면 끊긴 지점부터 이어서 작성합니다.</span>' +
    '<button id="insight-continue" class="btn btn-primary" type="button">이어서 계속</button></div>');

  const cont = document.getElementById('insight-continue');
  if(!cont) return;
  cont.addEventListener('click', () => {
    cont.disabled = true;
    cont.textContent = '생성 중…';
    runInsight(true);   // 결과에 따라 안내가 다시 렌더링됩니다.
  });
}

function initInsight(){
  const button = document.getElementById('insight-run');
  if(!button) return;
  button.addEventListener('click', () => runInsight(false));

  // 같은 데이터에 대한 해설이 이미 있으면 재호출 없이 보여줍니다.
  const mode = effectiveMode();
  const cached = insightCacheGet(CURRENT.generatedAt, mode);
  if(cached){
    showInsight(cached.text, (cached.meta || '') + ' · 저장된 해설');
    document.getElementById('insight-run-label').textContent = '다시 생성';
    INSIGHT_CTX = {
      digest: cached.digest || buildDigest(CURRENT),
      text: cached.text,
      usage: { input:0, output:0 }
    };
    if(cached.truncated){
      renderContinueNotice();
    }else{
      setInsightStatus('<p class="insight-meta" style="margin-top:10px">동일한 수집 시점의 해설이 저장되어 있어 그대로 표시했습니다. 새로 생성하시려면 위 버튼을 누르십시오.</p>');
    }
  }
}

/* ── 테마 ─────────────────────────────────────────────── */
const THEME_KEY = 'nibot_theme';
function applyTheme(t){
  const next = t === 'light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  document.getElementById('theme-label').textContent = next === 'dark' ? '라이트 모드' : '다크 모드';
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){ /* 무시 */ }
}
document.getElementById('theme').addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

/* ── 시작 ─────────────────────────────────────────────── */
(async function boot(){
  let stored = 'dark';
  try{ stored = localStorage.getItem(THEME_KEY) || 'dark'; }catch(e){ /* 무시 */ }
  applyTheme(stored);

  try{
    const response = await fetch(DATA_URL, { cache: 'no-cache' });
    if(!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    if(!data || typeof data !== 'object' || !data.generatedAt) throw new Error('데이터 형식이 올바르지 않습니다.');
    CURRENT = data;
    document.getElementById('root').innerHTML = render(data);

    NB = await loadSharedHook();
    if(NB){
      initInsight();
    }else{
      setInsightStatus('<div class="note" style="margin-top:12px">' +
        '<b>AI 해설을 사용할 수 없습니다.</b> 챗봇 모듈(<code>ni-bot.html</code>)을 같은 폴더에서 불러오지 못했습니다. ' +
        '로컬에서 여신 경우 <code>python3 -m http.server 8787</code> 로 실행한 뒤 접속해 주십시오.</div>');
      const runBtn = document.getElementById('insight-run');
      if(runBtn) runBtn.disabled = true;
    }
  }catch(error){
    console.error('[dashboard]', error);
    renderError('데이터를 불러오지 못했습니다.', error.message);
  }
})();
</script>
